name: Generate Minecraft sources
description: Decompile one Minecraft version, optionally zip/upload, with shared Gradle and work caches.

inputs:
  version:
    description: Minecraft version id (e.g. 1.20.1)
    required: true
  force:
    description: Pass -Pforce when true
    required: false
    default: "false"
  upload_artifact:
    description: When true, zip sources and upload as an Actions artifact
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "25"
        cache: gradle
        cache-dependency-path: |
          **/*.gradle*
          **/gradle-wrapper.properties
          **/libs.versions.toml
          gradle.properties

    - name: Restore work cache
      id: work-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          work/cache
          work/libs
          work/decompile-cache
        key: mcsg-work-${{ runner.os }}-${{ inputs.version }}-${{ github.run_id }}
        restore-keys: |
          mcsg-work-${{ runner.os }}-${{ inputs.version }}-
          mcsg-work-${{ runner.os }}-

    - name: Generate sources
      shell: pwsh
      env:
        MC_VERSION: ${{ inputs.version }}
        FORCE: ${{ inputs.force }}
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1g -Dorg.gradle.daemon=false"
      run: |
        $gradleArgs = @(
          "generateVersion",
          "-Pmc=$env:MC_VERSION",
          "-Peula=true",
          "-Pjobs=1",
          "-PvfThreads=4",
          "-PvfHeap=6g",
          "-PmainHeap=5g"
        )
        if ($env:FORCE -eq "true") {
          $gradleArgs += "-Pforce"
        }
        & .\gradlew.bat @gradleArgs --no-daemon
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }

    - name: Verify marker
      shell: pwsh
      env:
        MC_VERSION: ${{ inputs.version }}
      run: |
        $marker = Join-Path "sources" $env:MC_VERSION ".mcsg-done"
        if (-not (Test-Path -LiteralPath $marker)) {
          Write-Error "Missing $marker"
          exit 1
        }

    - name: Pack zip
      if: inputs.upload_artifact == 'true'
      shell: pwsh
      env:
        MC_VERSION: ${{ inputs.version }}
      run: |
        $src = Join-Path "sources" $env:MC_VERSION
        $zip = "mc-sources-$env:MC_VERSION.zip"
        if (Test-Path -LiteralPath $zip) {
          Remove-Item -LiteralPath $zip -Force
        }
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        [System.IO.Compression.ZipFile]::CreateFromDirectory(
          (Resolve-Path -LiteralPath $src).Path,
          (Join-Path (Get-Location) $zip)
        )

    - name: Save work cache
      if: success()
      uses: actions/cache/save@v4
      with:
        path: |
          work/cache
          work/libs
          work/decompile-cache
        key: ${{ steps.work-cache.outputs.cache-primary-key }}

    - name: Upload artifact
      if: inputs.upload_artifact == 'true'
      uses: actions/upload-artifact@v7
      with:
        path: mc-sources-${{ inputs.version }}.zip
        archive: false
        retention-days: 1
        if-no-files-found: error
