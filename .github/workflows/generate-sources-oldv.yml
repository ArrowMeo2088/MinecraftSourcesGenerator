# Temporary CI decompile for a fixed set of older Minecraft releases.
# Decompiled sources are Mojang copyright; do not leave Artifacts public long-term.
# Download, then delete Artifacts. Free plan artifact storage is ~500 MB — run one group at a time.
name: Generate sources (oldv)

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if sources already exist (-Pforce)
        type: boolean
        default: false

concurrency:
  group: generate-sources-oldv
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    name: ${{ matrix.version }}
    runs-on: windows-2025
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        version:
          - "1.7.10"
          - "1.8.9"
          - "1.9.4"
          - "1.10.2"
          - "1.11.2"
          - "1.12.2"
          - "1.16.5"
          - "1.18.2"
          - "1.19.2"
          - "1.19.4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Generate sources
        shell: pwsh
        env:
          MC_VERSION: ${{ matrix.version }}
          FORCE: ${{ inputs.force }}
        run: |
          $gradleArgs = @(
            "generateVersion",
            "-Pmc=$env:MC_VERSION",
            "-Peula=true",
            "-Pjobs=1",
            "-PvfThreads=4",
            "-PvfHeap=4g"
          )
          if ($env:FORCE -eq "true") {
            $gradleArgs += "-Pforce"
          }
          & .\gradlew.bat @gradleArgs --no-daemon
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify marker
        shell: pwsh
        env:
          MC_VERSION: ${{ matrix.version }}
        run: |
          $marker = Join-Path "sources" $env:MC_VERSION ".mcsg-done"
          if (-not (Test-Path -LiteralPath $marker)) {
            Write-Error "Missing $marker"
            exit 1
          }

      - name: Pack zip
        shell: pwsh
        env:
          MC_VERSION: ${{ matrix.version }}
        run: |
          $src = Join-Path "sources" $env:MC_VERSION
          $zip = "mc-sources-$env:MC_VERSION.zip"
          if (Test-Path -LiteralPath $zip) {
            Remove-Item -LiteralPath $zip -Force
          }
          # ZipFile includes hidden files (e.g. .mcsg-done); Compress-Archive often does not.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path -LiteralPath $src).Path,
            (Join-Path (Get-Location) $zip)
          )

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: mc-sources-${{ matrix.version }}.zip
          archive: false
          retention-days: 1
          if-no-files-found: error
