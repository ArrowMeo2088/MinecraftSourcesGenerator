# Warm shared toolchain caches only (Gradle wrapper + Maven deps + compile this project).
# Does NOT decompile Minecraft — that is mostly per-version (jars/mappings/libs) and belongs in
# MainVersion / SelectVersion. Running generate here would just be a full generate pass with no artifacts.
# Optional: run once after dependency bumps so the first generate job is faster; otherwise you can skip this
# and go straight to MainVersion / SelectVersion (setup-java will warm Gradle on first generate anyway).
name: UpdateCache

on:
  workflow_dispatch:

concurrency:
  group: update-cache
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  warm:
    name: Warm Gradle toolchain
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            **/libs.versions.toml
            gradle.properties

      - name: Resolve deps, compile, listVersions
        shell: pwsh
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1g -Dorg.gradle.daemon=false"
        run: |
          & .\gradlew.bat --refresh-dependencies classes listVersions --no-daemon
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Summary
        shell: pwsh
        run: |
          @"
          ## UpdateCache — shared toolchain only
          - Runner: ``windows-2025``
          - Warmed: Gradle wrapper, project Maven deps (remapper / Vineflower / ASM / …), compiled classes
          - Verified: ``listVersions`` against Mojang manifest
          - Not warmed: Minecraft jars, mappings, ``work/libs``, decompile-cache (those are per-version; use MainVersion / SelectVersion)
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
